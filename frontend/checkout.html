<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Horta Viva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 antialiased selection:bg-lime-200 selection:text-lime-900">
    <!-- Navbar Minimalista para Checkout -->
    <nav class="bg-lime-800 text-stone-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-center items-center h-16">
                <a href="/" class="font-extrabold text-2xl tracking-tight flex items-center gap-2">
                    <span>🌿</span> Horta Viva <span class="text-lime-300 text-lg ml-2 font-medium">Checkout Seguro</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Formulário -->
            <div class="flex-1 space-y-8">
                <!-- Informação Pessoal -->
                <div class="bg-white rounded-xl shadow-md border border-stone-100 p-8">
                    <h2 class="text-2xl font-bold text-stone-800 mb-6 flex items-center gap-2">
                        <span class="bg-lime-200 text-lime-900 w-8 h-8 rounded-full flex items-center justify-center text-sm">1</span> 
                        Morada de Entrega
                    </h2>
                    <form class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-stone-700 mb-1">Nome</label>
                                <input type="text" id="input-nome" class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-lime-600 focus:border-transparent outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-stone-700 mb-1">Apelido</label>
                                <input type="text" id="input-apelido" class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-lime-600 focus:border-transparent outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-stone-700 mb-1">Endereço Completo</label>
                            <input type="text" id="input-endereco" placeholder="Rua, Número, Andar..." class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-lime-600 focus:border-transparent outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-stone-700 mb-1">Código Postal</label>
                                <input type="text" id="input-cep" class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-lime-600 focus:border-transparent outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-stone-700 mb-1">Cidade</label>
                                <input type="text" id="input-cidade" class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-lime-600 focus:border-transparent outline-none">
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Pagamento -->
                <div class="bg-white rounded-xl shadow-md border border-stone-100 p-8">
                    <h2 class="text-2xl font-bold text-stone-800 mb-6 flex items-center gap-2">
                        <span class="bg-lime-200 text-lime-900 w-8 h-8 rounded-full flex items-center justify-center text-sm">2</span> 
                        Método de Pagamento
                    </h2>
                    <div class="space-y-3">
                        <label class="flex items-center p-4 border border-stone-200 rounded-lg cursor-pointer hover:bg-stone-50 transition">
                            <input type="radio" name="payment" class="w-5 h-5 text-lime-600 focus:ring-lime-600" checked>
                            <span class="ml-3 font-semibold text-stone-800">MB Way</span>
                        </label>
                        <label class="flex items-center p-4 border border-stone-200 rounded-lg cursor-pointer hover:bg-stone-50 transition">
                            <input type="radio" name="payment" class="w-5 h-5 text-lime-600 focus:ring-lime-600">
                            <span class="ml-3 font-semibold text-stone-800">Cartão de Crédito</span>
                        </label>
                        <label class="flex items-center p-4 border border-stone-200 rounded-lg cursor-pointer hover:bg-stone-50 transition">
                            <input type="radio" name="payment" class="w-5 h-5 text-lime-600 focus:ring-lime-600">
                            <span class="ml-3 font-semibold text-stone-800">Referência Multibanco</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Resumo e Confirmar -->
            <div class="w-full lg:w-96">
                <div class="bg-white rounded-xl shadow-md border border-stone-100 p-8 sticky top-24">
                    <h2 class="text-xl font-bold text-stone-800 border-b border-stone-100 pb-4 mb-4">A Sua Encomenda</h2>
                    
                    <div id="checkout-items" class="space-y-3 mb-6 max-h-60 overflow-y-auto pr-2">
                        <!-- JS Items -->
                    </div>

                    <div class="border-t border-stone-100 pt-4 space-y-2 text-stone-600">
                        <div class="flex justify-between">
                            <span>Subtotal</span>
                            <span id="check-subtotal" class="font-semibold text-stone-800">€ 0.00</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Frete Estimado</span>
                            <span class="font-semibold text-stone-800">€ 2.50</span>
                        </div>
                    </div>

                    <div class="flex justify-between text-xl font-extrabold text-stone-800 border-t border-stone-200 pt-4 mt-4 mb-8">
                        <span>Total</span>
                        <span id="check-total" class="text-lime-700">€ 0.00</span>
                    </div>

                    <button onclick="finalizarPedido()" class="w-full block text-center bg-lime-700 hover:bg-lime-800 text-white font-bold py-4 rounded-lg shadow-lg transition-transform transform active:scale-95 text-lg">
                        Confirmar Pagamento
                    </button>
                    <p class="text-xs text-center text-stone-500 mt-4 flex items-center justify-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                        Pagamento Seguro com Encriptação SSL
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script src="app.js"></script>
    <script>
        let clientId = null;
        let freightCost = parseFloat(localStorage.getItem('hortaviva_freight')) || 2.50;

        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('checkout-items');
            if(cart.length === 0) {
                container.innerHTML = '<p class="text-sm text-stone-500 text-center">Nenhum item.</p>';
                return;
            }

            let sub = 0;
            const itemsPayload = [];
            container.innerHTML = cart.map(i => {
                const tot = i.price * i.quantity;
                sub += tot;
                itemsPayload.push({
                    produto_id: i.id,
                    quantidade: i.quantity,
                    preco_unitario: i.price
                });
                return `
                <div class="flex justify-between items-center text-sm">
                    <span class="font-medium text-stone-700 truncate w-48">${i.quantity}x ${i.name}</span>
                    <span class="font-bold text-lime-700">€ ${tot.toFixed(2)}</span>
                </div>`;
            }).join('');

            document.getElementById('check-subtotal').innerText = `€ ${sub.toFixed(2)}`;
            document.getElementById('frete-estimado-val').innerText = `€ ${freightCost.toFixed(2)}`;
            document.getElementById('check-total').innerText = `€ ${(sub + freightCost).toFixed(2)}`;

            // Pré-preenchimento do Cliente
            try {
                const res = await fetch('http://localhost:2020/api/clientes/', { headers: getAuthHeaders() });
                if (res.ok) {
                    const data = await res.json();
                    const clientes = data.results || data;
                    if (clientes.length > 0) {
                        const cliente = clientes[0];
                        clientId = cliente.id;
                        document.getElementById('input-nome').value = cliente.nome.split(' ')[0] || '';
                        document.getElementById('input-apelido').value = cliente.nome.split(' ').slice(1).join(' ') || '';
                        
                        if (cliente.enderecos && cliente.enderecos.length > 0) {
                            const end = cliente.enderecos.find(e => e.is_principal) || cliente.enderecos[0];
                            document.getElementById('input-endereco').value = `${end.rua}, ${end.numero || ''} ${end.bairro || ''}`;
                            document.getElementById('input-cep').value = end.cep || '';
                            document.getElementById('input-cidade').value = end.cidade || '';
                        }
                    }
                }
            } catch (e) {
                console.error('Erro ao buscar dados do cliente', e);
            }
        });

        async function finalizarPedido() {
            if(cart.length === 0) {
                showToast('O seu carrinho está vazio!', 'error');
                return;
            }

            const paymentRadios = document.getElementsByName('payment');
            let paymentMethod = 'cartao';
            for (const radio of paymentRadios) {
                if (radio.checked) paymentMethod = radio.value;
            }

            let sub = 0;
            const itensList = cart.map(i => {
                sub += i.price * i.quantity;
                return {
                    produto: i.id,
                    quantidade: i.quantity,
                    preco_unitario: i.price
                };
            });

            const payload = {
                cliente: clientId,
                forma_pagamento: paymentMethod,
                custo_frete: freightCost.toFixed(2),
                total_produtos: sub.toFixed(2),
                total_pedido: (sub + freightCost).toFixed(2),
                itens: itensList
            };

            try {
                const res = await fetch('http://localhost:2020/api/pedidos/', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    cart = [];
                    localStorage.removeItem('hortaviva_cart');
                    localStorage.removeItem('hortaviva_freight');
                    localStorage.removeItem('hortaviva_total');
                    showToast('Encomenda realizada com sucesso!', 'success');
                    setTimeout(() => window.location.href = 'minha-conta.html', 1500);
                } else {
                    const err = await res.json();
                    console.error('Erro API:', err);
                    showToast('Falha ao processar encomenda. Tente novamente.', 'error');
                }
            } catch(e) {
                console.error(e);
                showToast('Erro de rede ao finalizar pedido.', 'error');
            }
        }
    </script>
</body>
</html>
