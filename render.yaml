databases:
  - name: hortaviva-db
    databaseName: hortaviva_db
    user: hortaviva_admin
    plan: free
    region: frankfurt

services:
  - type: web
    name: hortaviva-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "cd software && gunicorn configuracao.wsgi:application"
    plan: free
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hortaviva-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "True"
      - key: ALLOWED_HOSTS
        value: "hortaviva-web.onrender.com,localhost,127.0.0.1"
