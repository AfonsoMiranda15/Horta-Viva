{% extends "admin/change_list.html" %}

{% block content %}
<div style="padding: 20px;">
    <h1>Relatórios Gerenciais - Horta Viva</h1>
    <div style="display: flex; gap: 20px; margin-top: 20px;">
        <div style="background: #fff; border: 1px solid #ccc; padding: 20px; border-radius: 8px; flex: 1;">
            <h3 style="margin: 0; color: #666;">Total de Faturamento</h3>
            <p style="font-size: 32px; font-weight: bold; color: #4d7c0f; margin: 10px 0 0 0;">€ {{ total_vendas|floatformat:2 }}</p>
        </div>
        <div style="background: #fff; border: 1px solid #ccc; padding: 20px; border-radius: 8px; flex: 1;">
            <h3 style="margin: 0; color: #666;">Total de Pedidos</h3>
            <p style="font-size: 32px; font-weight: bold; color: #4d7c0f; margin: 10px 0 0 0;">{{ total_pedidos }}</p>
        </div>
        <div style="background: #fff; border: 1px solid #ccc; padding: 20px; border-radius: 8px; flex: 1;">
            <h3 style="margin: 0; color: #666;">Ticket Médio</h3>
            <p style="font-size: 32px; font-weight: bold; color: #4d7c0f; margin: 10px 0 0 0;">€ {{ ticket_medio|floatformat:2 }}</p>
        </div>
    </div>
</div>
<!-- Não mostrar a lista padrão do django -->
{% endblock %}
