{% load static i18n %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto - Horta Viva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    
    <link rel="icon" type="image/svg+xml" href="{% static 'web/images/favicon.svg' %}">
</head>
<body class="bg-stone-50 text-stone-800 antialiased selection:bg-lime-200 selection:text-lime-900">
    {% include "web/components/header.html" %}

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12" id="product-container">
        <div class="text-center py-20 text-stone-500">A carregar detalhes do produto...</div>
    </main>

    <script src="{% static 'web/app.js' %}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            const container = document.getElementById('product-container');

            if (!productId) {
                container.innerHTML = '<div class="text-center py-20 text-red-500 font-bold text-xl">Produto não encontrado.</div>';
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/produtos/${productId}/`, { headers: getAuthHeaders() });
                if (!response.ok) throw new Error('Produto não encontrado');
                const p = await response.json();

                const basePrice = parseFloat(p.preco || 0);
                const promoPrice = parseFloat(p.preco_promocional || 0);
                const hasPromo = promoPrice > 0 && promoPrice < basePrice;
                const price = (hasPromo ? promoPrice : basePrice).toFixed(2);
                const oldPrice = basePrice.toFixed(2);
                let imgUrl = p.imagem_principal || p.imagem || 'https://images.unsplash.com/photo-1610348725531-843dff563e2c?auto=format&fit=crop&q=80&w=800';
                if (imgUrl.startsWith('/')) imgUrl = `http://localhost:8520${imgUrl}`;

                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-stone-100 flex flex-col md:flex-row">
                        <!-- Imagem -->
                        <div class="md:w-1/2 bg-stone-100 flex items-center justify-center p-8 relative">
                            <button onclick="toggleFavorite(${p.id}, this)" class="absolute top-4 right-4 z-20 p-3 rounded-full bg-white/50 hover:bg-white/80 backdrop-blur-sm transition-colors duration-200 shadow focus:outline-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 transition-colors duration-200 ${favorites.includes(p.id) ? 'text-red-500 fill-current' : 'text-stone-400'}" fill="${favorites.includes(p.id) ? 'currentColor' : 'none'}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                                </svg>
                            </button>
                            <img src="${imgUrl}" alt="${p.nome}" class="w-full max-h-96 object-contain drop-shadow-xl">
                        </div>
                        
                        <!-- Detalhes -->
                        <div class="md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
                            <h2 class="text-sm font-bold text-lime-600 uppercase tracking-widest mb-2">${p.categoria_nome || 'Geral'}</h2>
                            <h1 class="text-4xl md:text-5xl font-extrabold text-stone-900 mb-4">${p.nome}</h1>
                            
                            <div class="flex items-center flex-wrap gap-2 mb-4">
                                ${p.estoque > 0 ? 
                                `<span class="bg-lime-100 text-lime-800 text-xs font-bold px-3 py-1 rounded-full shadow-sm border border-lime-200">Em Stock</span>` : 
                                `<span class="bg-red-100 text-red-800 text-xs font-bold px-3 py-1 rounded-full shadow-sm border border-red-200">Esgotado</span>`}
                                ${p.produto_organico ? `<span class="bg-lime-200 text-lime-900 text-xs font-bold px-3 py-1 rounded-full shadow-sm">🌿 Orgânico</span>` : ''}
                                ${p.produto_sazonal ? `<span class="bg-yellow-200 text-yellow-900 text-xs font-bold px-3 py-1 rounded-full shadow-sm">☀️ Sazonal</span>` : ''}
                                ${p.produto_em_destaque ? `<span class="bg-purple-100 text-purple-800 text-xs font-bold px-3 py-1 rounded-full shadow-sm">⭐ Destaque</span>` : ''}
                                ${p.produto_variavel ? `<span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full shadow-sm">📦 Variável</span>` : ''}
                            </div>
                            
                            <div class="flex items-end gap-3 mb-6">
                                <p class="text-3xl text-lime-700 font-black">€ ${price} <span class="text-sm text-stone-500 font-normal">/ ${p.unidade || 'unid'}</span></p>
                                ${hasPromo ? `<p class="text-xl text-stone-400 line-through mb-1">€ ${oldPrice}</p>` : ''}
                            </div>
                            
                            ${p.descricao_curta ? `<p class="text-stone-500 text-lg mb-6 leading-relaxed">${p.descricao_curta}</p>` : ''}
                            
                            <div class="text-stone-600 leading-relaxed mb-8 text-sm">
                                ${p.descricao_completa || (!p.descricao_curta ? 'Nenhuma descrição fornecida.' : '')}
                            </div>

                            ${p.variacoes_detalhes && p.variacoes_detalhes.length > 0 ? `
                            <div class="mb-6">
                                <label class="block text-sm font-semibold text-stone-700 mb-2">Opções Disponíveis</label>
                                <select id="product-variation" class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-lime-600 focus:border-transparent outline-none">
                                    ${p.variacoes_detalhes.map(v => `<option value="${v.termo}">${v.termo}</option>`).join('')}
                                </select>
                            </div>
                            ` : ''}

                            <div class="flex flex-col sm:flex-row gap-4">
                                <button ${p.estoque <= 0 ? 'disabled' : ''} onclick="addCurrentToCart(${p.id}, '${p.nome.replace(/'/g, "\\'")}', ${price})" 
                                    class="flex-1 ${p.estoque <= 0 ? 'bg-stone-400 cursor-not-allowed' : 'bg-lime-700 hover:bg-lime-800'} text-white text-lg font-bold py-4 px-8 rounded-xl shadow-lg transition-transform transform ${p.estoque > 0 ? 'active:scale-95' : ''} flex items-center justify-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                                    </svg>
                                    ${p.estoque <= 0 ? 'Esgotado' : 'Adicionar ao Carrinho'}
                                </button>
                                ${p.estoque > 0 ? `
                                <a href="{% url 'carrinho' %}" class="bg-stone-800 hover:bg-stone-900 text-white text-lg font-bold py-4 px-8 rounded-xl shadow-lg transition-transform transform active:scale-95 text-center">
                                    Comprar Agora
                                </a>
                                ` : ''}
                            </div>

                            <div class="mt-8 pt-8 border-t border-stone-100 flex items-center gap-4 text-sm text-stone-500">
                                ${p.estoque > 0 ? `
                                <span class="flex items-center gap-1"><svg class="w-5 h-5 text-lime-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg> Em Stock</span>
                                ` : `
                                <span class="flex items-center gap-1 font-bold text-red-500"><svg class="w-5 h-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> Esgotado</span>
                                `}
                                <span class="flex items-center gap-1"><svg class="w-5 h-5 text-lime-500" fill="currentColor" viewBox="0 0 20 20"><path d="M4 3a2 2 0 100 4h12a2 2 0 100-4H4z"></path><path fill-rule="evenodd" d="M3 8h14v7a2 2 0 01-2 2H5a2 2 0 01-2-2V8zm5 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" clip-rule="evenodd"></path></svg> Pagamento Seguro</span>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = '<div class="text-center py-20 text-red-500 font-bold text-xl">Erro ao carregar o produto.</div>';
            }
        });

        function addCurrentToCart(id, name, price, stock) {
            let varSel = document.getElementById('product-variation');
            let varName = varSel ? varSel.value : '';
            let finalName = varName ? `${name} (${varName})` : name;
            addToCart(id, finalName, price, stock);
        }
    </script>
</body>
</html>
