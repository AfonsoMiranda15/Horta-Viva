{% load static i18n %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Horta Viva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    
    <link rel="icon" type="image/svg+xml" href="{% static 'web/images/favicon.svg' %}">
</head>
<body class="bg-stone-50 text-stone-800 antialiased selection:bg-lime-200 selection:text-lime-900 flex flex-col min-h-screen">
    {% include "web/components/header.html" %}

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white p-8 rounded-xl shadow-md border border-stone-100 max-w-md w-full">
            <h2 class="text-2xl font-bold text-stone-800 mb-6 text-center">Iniciar Sessão</h2>
            <form id="login-form" method="POST" action="{% url 'login' %}" class="space-y-4">
                {% csrf_token %}
                {% if form.errors %}
                <div class="bg-red-100 text-red-700 p-3 rounded text-sm">
                    Nome de utilizador ou password incorretos.
                </div>
                {% endif %}
                <div>
                    <label class="block text-sm font-medium text-stone-700">Username</label>
                    <input type="text" name="username" id="login-username" required class="mt-1 block w-full rounded-md border-stone-300 shadow-sm focus:border-lime-500 focus:ring-lime-500 bg-stone-50 py-2 px-3">
                </div>
                <div>
                    <div class="flex justify-between items-center">
                        <label class="block text-sm font-medium text-stone-700">Password</label>
                        <a href="#" class="text-xs text-lime-600 hover:underline">Esqueceu a senha?</a>
                    </div>
                    <input type="password" name="password" id="login-password" required class="mt-1 block w-full rounded-md border-stone-300 shadow-sm focus:border-lime-500 focus:ring-lime-500 bg-stone-50 py-2 px-3">
                </div>
                <button type="submit" class="w-full bg-lime-700 hover:bg-lime-800 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-md">Entrar</button>
            </form>
            <div class="mt-6 text-center">
                <p class="text-sm text-stone-600">Ainda não tem conta? <a href="{% url 'cadastro' %}" class="text-lime-700 font-bold hover:underline">Registe-se</a></p>
            </div>
        </div>
    </main>

    <script src="{% static 'web/app.js' %}"></script>
</body>
</html>
